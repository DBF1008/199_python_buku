Fetch the list of tags
---
#GET /api/tags

tags: [Tags]

parameters:
  - name: q
    in: query
    type: string
    required: false
    description: Filter tags by keyword (substring match)
  - name: limit
    in: query
    type: integer
    required: false
    default: 5
    description: Maximum number of tags to return (must be positive)
  - name: with_usage_count
    in: query
    type: boolean
    required: false
    default: false
    description: If true, return each tag with its usage count (sorted by usage descending)

responses:
  200:
    description: A list of tags (sorted lexicographically, or by usage count if with_usage_count=true)
    schema:
      allOf:
        - $ref: '#/definitions/Response:Success'
        - type: object
          properties:
            tags:
              type: array
              items:
                type: string
              example: ['bar', 'baz', 'foo']
              description: >
                When with_usage_count=false (default), an array of tag name strings.
                When with_usage_count=true, an array of objects with "name" and "usage_count" fields.
